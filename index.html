<title>Nova Transação</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c;--surf:#131316;--surf2:#1a1a1f;--surf3:#222228;
  --brd:#27272f;--brd2:#32323c;--txt:#f2f2f5;
  --mu:#5c5c70;--mu2:#8888a0;
  --red:#ff6b6b;--red-d:rgba(255,107,107,.13);--red-b:rgba(255,107,107,.4);
  --grn:#3dd68c;--grn-d:rgba(61,214,140,.13);--grn-b:rgba(61,214,140,.4);
  --acc:#7c7cff;
  --r:14px;--rsm:10px;
  --sans:'Plus Jakarta Sans',sans-serif;--mono:'DM Mono',monospace;
  --toph:env(safe-area-inset-top,0px);
  --both:env(safe-area-inset-bottom,0px);
  --lft:env(safe-area-inset-left,0px);
  --rgt:env(safe-area-inset-right,0px);
  --tab:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;}

/* ── SHELL ── */
#shell{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* ── PAGES ── */
#pages{
  flex:1 1 0;
  min-height:0;
  position:relative;
  overflow:hidden;
}
.page{
  position:absolute;
  inset:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:
    calc(var(--toph) + 20px)
    calc(var(--rgt) + 16px)
    32px
    calc(var(--lft) + 16px);
  background:var(--bg);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
#pform{transform:translateX(0);}
#phist{transform:translateX(100%);}
.show-hist #pform{transform:translateX(-100%);}
.show-hist #phist{transform:translateX(0);}

/* ── TABBAR ── */
#tabbar{
  flex:0 0 auto;
  display:flex;
  align-items:stretch;
  background:var(--surf);
  border-top:1px solid var(--brd);
  padding-bottom:var(--both);
}
.tbtn{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:10px 8px;
  border:none;background:transparent;cursor:pointer;
  font-family:var(--sans);font-size:10px;font-weight:600;
  color:var(--mu2);letter-spacing:.02em;
  border-top:2px solid transparent;
  transition:color .15s,border-color .15s;
}
.tbtn svg{width:22px;height:22px;flex-shrink:0;}
.tbtn.on{color:var(--txt);border-top-color:var(--acc);}

/* ── COMPONENTS ── */
.ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;}
.ph-title{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;}
.eyebrow{font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
.pill{font-family:var(--mono);font-size:11px;color:var(--mu2);background:var(--surf2);border:1px solid var(--brd);border-radius:20px;padding:5px 10px;}

.ttoggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:5px;margin-bottom:12px;}
.ttype{padding:11px 8px;border-radius:10px;border:none;background:transparent;color:var(--mu2);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;}
.ttype svg{width:15px;height:15px;flex-shrink:0;}
.ttype.as{background:var(--red-d);color:var(--red);box-shadow:inset 0 0 0 1px var(--red-b);}
.ttype.ae{background:var(--grn-d);color:var(--grn);box-shadow:inset 0 0 0 1px var(--grn-b);}

.card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.clbl{font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;}
.stk{display:flex;flex-direction:column;gap:10px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:11px;font-weight:600;color:var(--mu2);letter-spacing:.04em;text-transform:uppercase;}

input,select{width:100%;background:var(--surf2);border:1px solid var(--brd2);border-radius:var(--rsm);padding:11px 12px;font-family:var(--sans);font-size:15px;color:var(--txt);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,124,255,.12);}
input::placeholder{color:var(--mu);}
select option{background:var(--surf2);}
#valor{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:13px 12px;}

.pinfo{background:var(--surf3);border-radius:var(--rsm);padding:9px 12px;font-family:var(--mono);font-size:11px;color:var(--mu2);line-height:1.7;}
.pinfo strong{color:var(--txt);}

/* preview */
.prevc{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;margin-bottom:10px;display:none;}
.prevh{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--brd);}
.prevh .lbl{font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;}
.prevv{font-size:19px;font-weight:700;letter-spacing:-.02em;}
.pr{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--brd);font-size:13px;}
.pr:last-child{border-bottom:none;}
.prk{color:var(--mu2);font-weight:500;}
.prv{color:var(--txt);font-weight:600;font-family:var(--mono);font-size:12px;}

/* botão enviar */
.benv{width:100%;padding:15px;border:none;border-radius:var(--r);font-family:var(--sans);font-size:16px;font-weight:700;cursor:pointer;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;transition:opacity .15s,transform .1s;}
.benv:active{transform:scale(.97);}
.benv:disabled{opacity:.3;cursor:not-allowed;}
.benv.bs{background:var(--red);color:#1a0000;}
.benv.be{background:var(--grn);color:#001a0e;}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:rgba(0,0,0,.8);border-radius:50%;flex-shrink:0;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin.on{display:block;animation:spin .7s linear infinite;}
.blim{width:100%;text-align:center;font-size:13px;color:var(--mu2);font-weight:500;padding:12px;cursor:pointer;background:none;border:none;font-family:var(--sans);}

/* modal */
#mov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:24px;z-index:300;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .2s;}
#mov.on{opacity:1;pointer-events:all;}
.modal{background:var(--surf);border:1px solid var(--grn-b);border-radius:var(--r);padding:28px 22px 20px;width:100%;max-width:300px;text-align:center;transform:scale(.93);transition:transform .2s;}
#mov.on .modal{transform:scale(1);}
.m-ico{font-size:36px;margin-bottom:10px;}
.m-ttl{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;}
.m-msg{font-size:13px;color:var(--mu2);line-height:1.6;margin-bottom:20px;font-family:var(--mono);}
.m-ok{width:100%;padding:12px;background:var(--grn);color:#001a0e;border:none;border-radius:var(--rsm);font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;}

/* toast */
#tst{position:fixed;bottom:calc(var(--both) + var(--tab) + 16px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--surf);border:1px solid var(--brd2);border-radius:40px;padding:10px 18px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transition:all .25s;pointer-events:none;z-index:200;box-shadow:0 6px 24px rgba(0,0,0,.5);}
#tst.on{opacity:1;transform:translateX(-50%) translateY(0);}
#tst.err{border-color:var(--red-b);color:var(--red);}

/* ── HISTÓRICO ── */
.hist-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;}
.hrefr{display:flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--brd2);border-radius:20px;padding:7px 12px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--mu2);cursor:pointer;}
.hrefr:active{opacity:.7;}
.hrefr svg{width:14px;height:14px;}
.hrefr.ld svg{animation:spin .7s linear infinite;}

.txc{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);margin-bottom:8px;overflow:hidden;cursor:pointer;}
.txrow{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;gap:10px;}
.txleft{flex:1;min-width:0;}
.txnm{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txdt{font-size:11px;color:var(--mu2);margin-top:3px;font-family:var(--mono);}
.txright{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:8px;}
.txvl{font-family:var(--mono);font-size:13px;font-weight:600;}
.txvl.s{color:var(--red);}
.txvl.e{color:var(--grn);}
.txarr{width:14px;height:14px;flex-shrink:0;color:var(--mu);transition:transform .2s;}
.txarr.open{transform:rotate(180deg);}

/* detalhes expandidos */
.txdet{display:none;border-top:1px solid var(--brd);padding:12px 14px;background:var(--surf2);}
.txdet.open{display:block;}
.detrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--brd);font-size:12px;}
.detrow:last-child{border-bottom:none;}
.detk{color:var(--mu2);font-weight:500;}
.detv{color:var(--txt);font-weight:600;font-family:var(--mono);font-size:11px;text-align:right;}

/* parcelas subtarefa */
.parcblock{margin-top:10px;border:1px solid var(--brd);border-radius:var(--rsm);overflow:hidden;}
.parcblock-ttl{font-family:var(--mono);font-size:10px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;background:var(--surf3);border-bottom:1px solid var(--brd);}
.parcr{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--brd);font-size:12px;}
.parcr:last-child{border-bottom:none;}
.parcn{font-family:var(--mono);color:var(--mu2);min-width:38px;}
.parcd{color:var(--mu2);flex:1;font-family:var(--mono);}
.parcv{font-family:var(--mono);font-weight:600;color:var(--txt);}

.hemp{text-align:center;padding:3rem 1rem;font-size:13px;color:var(--mu);font-family:var(--mono);}
.herr{background:var(--red-d);border:1px solid var(--red-b);border-radius:var(--r);padding:14px;font-size:12px;color:var(--red);line-height:1.6;font-family:var(--mono);}
</style>
</head>
<body>
<div id="shell">

  <div id="pages">

    <!-- FORM -->
    <div class="page" id="pform">
      <div class="ph">
        <div>
          <div class="eyebrow">google sheets</div>
          <div class="ph-title">nova transação</div>
        </div>
        <div class="pill" id="dpill"></div>
      </div>

      <div class="ttoggle">
        <button class="ttype as" id="bts" onclick="setTipo('Saída')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>saída
        </button>
        <button class="ttype" id="bte" onclick="setTipo('Entrada')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="17 17 7 17 7 7"/></svg>entrada
        </button>
      </div>

      <div class="card">
        <div class="clbl">valor</div>
        <div class="stk">
          <div class="fld"><label>R$</label><input type="number" id="valor" inputmode="decimal" placeholder="0,00" min="0" step="0.01" oninput="upd()"></div>
          <div class="r2">
            <div class="fld"><label>data</label><input type="date" id="data" oninput="upd()"></div>
            <div class="fld"><label>conta</label>
              <select id="conta" onchange="upd()">
                <option value="">conta...</option>
                <option selected>Inter</option>
                <option>Nubank</option>
                <option>C6 Bank</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="clbl">identificação</div>
        <div class="fld"><label>descrição</label><input type="text" id="nome" placeholder="ex: mercado, alimentação, salário..." oninput="upd()"></div>
      </div>

      <div class="card">
        <div class="clbl">pagamento</div>
        <div class="stk">
          <div class="fld"><label>forma</label>
            <select id="pag" onchange="onPag()">
              <option value="">selecione...</option>
              <option>Débito</option><option>Crédito</option><option>PIX</option>
              <option>Boleto</option><option>Dinheiro</option><option>Transferência</option>
            </select>
          </div>
          <div id="pwrap" style="display:none;">
            <div class="pinfo" id="pinfo" style="margin-bottom:10px;"></div>
            <div class="fld"><label>total de parcelas</label><input type="number" id="totparc" min="1" value="1" inputmode="numeric" oninput="upd()"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="clbl">categoria</div>
        <div class="r2">
          <div class="fld"><label>cat. 1</label><select id="cat1" onchange="onCat1()"><option value="">—</option></select></div>
          <div class="fld"><label>cat. 2</label><select id="cat2" onchange="upd()"><option value="">—</option></select></div>
        </div>
      </div>

      <div class="prevc" id="prevc">
        <div class="prevh"><span class="lbl">resumo</span><span class="prevv" id="prevv"></span></div>
        <div id="prevb"></div>
      </div>

      <button class="benv bs" id="benv" onclick="enviar()" disabled>
        <div class="spin" id="spin"></div><span id="blbl">lançar na planilha</span>
      </button>
      <button class="blim" onclick="resetar()">limpar formulário</button>
    </div>

    <!-- HIST -->
    <div class="page" id="phist">
      <div class="hist-hdr">
        <div class="ph-title">histórico</div>
        <button class="hrefr" id="bref" onclick="loadHist()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          atualizar
        </button>
      </div>
      <div id="hcont"><div class="hemp">toque em atualizar para carregar</div></div>
    </div>

  </div><!-- /pages -->

  <div id="tabbar">
    <button class="tbtn on" id="tf" onclick="goTab('form')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
      lançar
    </button>
    <button class="tbtn" id="th" onclick="goTab('hist')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      histórico
    </button>
  </div>

</div><!-- /shell -->

<div id="mov">
  <div class="modal">
    <div class="m-ico">✅</div>
    <div class="m-ttl">Transação lançada!</div>
    <div class="m-msg">A transação está lançada<br>no Banco de Dados 👍</div>
    <button class="m-ok" onclick="closeModal()">OK</button>
  </div>
</div>
<div id="tst"></div>

<script>
const URL = 'https://script.google.com/macros/s/AKfycbw-CLt1QqgIpEIKcWUJiLUjM4vJ5M7-EOAjMowG1OSO7XWo-Z5Sj6y-v6pjucPsx8bo/exec';

const C2 = {
  'Moradia':['Aluguel','Parcela da Casa','Móveis','Eletrodomésticos','Obras','Manutenção','Outros'],
  'Contas do Lar':['Conta de Luz','Conta de Água','Conta de Gás','Conta de Internet','Conta de Telefone','Taxa de Condomínio','Impostos','Outros'],
  'Mercado':['Supermercado','Açougue','Fruteira','Padaria','Outros'],
  'Transporte':['Ônibus','Uber','Carona','Metrô','Avião','Outros'],
  'Alimentação':['Estabelecimento','Café','Shopping','Ifood','Bar','Lanchonete','Sorveteria','Conveniência','Outros'],
  'Udesc':['RU','Impressões','Calc','Outros'],
  'Saúde':['Plano de Saúde','Consulta Médica','Dentista','Cirurgia','Serviços','Exames','Psicólogo','Seguros','Outros'],
  'Lazer':['Cinema','Parque','Teatro','Show','Passeios','Games','Hobby','Amigos','Outros'],
  'Pessoal':['Cabelereiro','Necessidades','Agrados','Eletrônicos','Outros'],
  'Presentes':['Aniversário','Surpresa','Dia dos Namo/Aniver Namoro','Datas Comemorativas','Outros'],
  'Academia':['Mensalidade','Suplementação','Personal Trainer','Nutricionista','Equipamentos','Outros'],
  'Educação':['Cursos','Escola','Faculdade','Material Escolar','Mentoria','Equipamentos','Outros'],
  'Vestuário':['Roupas','Sapatos','Acessórios','Outros'],
  'Viagens':['Hospedagem','Transporte','Alimentação','Passeios','Lembranças','Lazer','Outros'],
  'Assinaturas':['Streaming','Revista','Clubes','Boxes','Jogos','Outros'],
  'Pet':['Comida','Banho e Tosa','Vacinas','Hotel','Brinquedos','Acessórios','Outros'],
  'Carro':['Parcela do Carro','Conserto','Acessórios','Combustível','Peças','Manutenção','Aluguel','Seguro','Pedágio','Impostos','Multas','Estacionamento','Outros'],
  'Farmácia':['Remédios','Skincare','Higiene','Outros'],
  'Outros Gastos':['Gastos Inesperados','Sem Categoria'],
  'Renda Ativa':['Salário','Pró-Labore','Vale-Transporte','Vale-Alimentação','Férias/13º','Outros'],
  'Renda Passiva':['Dividendos','Juros Renda Fixa','Lucro Ações/FIIs','Aluguel Recebido','Reserva de Emergência','Outros'],
  'Renda Extra':['Freelancer','Cashback','Programas de Pontos','Venda de Itens','Outros'],
  'Apoio Familiar':['Pai','Vô','Herança','Presente de Aniversário','Outros'],
  'Acertos de Contas':['Dinheiro Emprestado','Dívida','Gasto Dividido','Outros'],
  'Outras Entradas':['Entradas Inesperadas','Sem Categoria'],
};
const C1S=['Moradia','Contas do Lar','Mercado','Transporte','Alimentação','Udesc','Saúde','Lazer','Pessoal','Presentes','Academia','Educação','Vestuário','Viagens','Assinaturas','Pet','Carro','Farmácia','Outros Gastos'];
const C1E=['Renda Ativa','Renda Passiva','Renda Extra','Apoio Familiar','Acertos de Contas','Outras Entradas'];

let tipo='Saída', aba='form';

function goTab(t){
  aba=t;
  document.getElementById('shell').classList.toggle('show-hist',t==='hist');
  document.getElementById('tf').classList.toggle('on',t==='form');
  document.getElementById('th').classList.toggle('on',t==='hist');
  if(t==='hist') loadHist();
}

let tx0=0,ty0=0;
document.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx)*0.8) return;
  if(dx<0&&aba==='form') goTab('hist');
  else if(dx>0&&aba==='hist') goTab('form');
},{passive:true});

function setTipo(t){
  tipo=t;
  document.getElementById('bts').className='ttype'+(t==='Saída'?' as':'');
  document.getElementById('bte').className='ttype'+(t==='Entrada'?' ae':'');
  document.getElementById('benv').className='benv '+(t==='Saída'?'bs':'be');
  fillC1(); upd();
}

function fillC1(){
  const sel=document.getElementById('cat1'), cur=sel.value;
  sel.innerHTML='<option value="">—</option>';
  (tipo==='Saída'?C1S:C1E).forEach(c=>{
    const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);
  });
  if((tipo==='Saída'?C1S:C1E).includes(cur)) sel.value=cur;
  else document.getElementById('cat2').innerHTML='<option value="">—</option>';
}

function onCat1(){
  const c1=document.getElementById('cat1').value, sel=document.getElementById('cat2');
  sel.innerHTML='<option value="">—</option>';
  (C2[c1]||[]).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
  upd();
}

function onPag(){
  const p=document.getElementById('pag').value;
  document.getElementById('pwrap').style.display=p==='Crédito'?'block':'none';
  upd();
}

function calcDP(){
  const p=document.getElementById('pag').value, d=document.getElementById('data').value;
  if(!d) return null;
  const dt=new Date(d+'T12:00:00');
  if(p==='Crédito'){if(dt.getDate()>=3)dt.setMonth(dt.getMonth()+1);dt.setDate(10);}
  return dt.toISOString().slice(0,10);
}

function fmtR(v){return 'R$ '+parseFloat(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function prow(k,v){return`<div class="pr"><span class="prk">${k}</span><span class="prv">${v}</span></div>`;}

function upd(){
  const nome=document.getElementById('nome').value.trim();
  const val=document.getElementById('valor').value;
  const dt=document.getElementById('data').value;
  const pag=document.getElementById('pag').value;
  const conta=document.getElementById('conta').value;
  const c1=document.getElementById('cat1').value;
  const c2=document.getElementById('cat2').value;
  const tot=parseInt(document.getElementById('totparc').value)||1;
  const dp=calcDP(); const isC=pag==='Crédito';

  if(isC&&val){
    const vp=(parseFloat(val)/tot).toFixed(2);
    const dpf=dp?new Date(dp+'T12:00:00').toLocaleDateString('pt-BR'):'—';
    document.getElementById('pinfo').innerHTML='parcela: <strong>R$ '+vp+'</strong> · vence: <strong>'+dpf+'</strong>';
  }

  const ok=nome&&val&&dt&&pag&&conta&&c1;
  document.getElementById('benv').disabled=!ok;
  const pc=document.getElementById('prevc');
  if(!ok){pc.style.display='none';return;}

  const vp=isC?(parseFloat(val)/tot).toFixed(2):parseFloat(val).toFixed(2);
  const dff=new Date(dt+'T12:00:00').toLocaleDateString('pt-BR');
  const dpf=dp?new Date(dp+'T12:00:00').toLocaleDateString('pt-BR'):'—';
  const cor=tipo==='Saída'?'#ff6b6b':'#3dd68c';
  pc.style.display='block';
  document.getElementById('prevv').innerHTML=`<span style="color:${cor}">${tipo==='Saída'?'- ':'+ '}${fmtR(val)}</span>`;
  document.getElementById('prevb').innerHTML=
    prow('descrição',nome)+prow('tipo',`<span style="color:${cor}">${tipo.toLowerCase()}</span>`)+
    (isC?prow('parcelas',`1/${tot} · R$ ${vp} cada`):'')+
    prow('data compra',dff)+prow('data parcela',dpf)+prow('pagamento',pag)+prow('conta',conta)+
    prow('categoria',c1+(c2?' › '+c2:''));
}

function setLoad(on){
  document.getElementById('spin').className=on?'spin on':'spin';
  document.getElementById('blbl').textContent=on?'lançando...':'lançar na planilha';
  document.getElementById('benv').disabled=on;
}

function showToast(msg,err){
  const el=document.getElementById('tst');
  el.textContent=msg;el.className='on'+(err?' err':'');
  setTimeout(()=>{el.className='';},3000);
}

async function enviar(){
  const nome=document.getElementById('nome').value.trim();
  const val=parseFloat(document.getElementById('valor').value);
  const dt=document.getElementById('data').value;
  const pag=document.getElementById('pag').value;
  const conta=document.getElementById('conta').value;
  const c1=document.getElementById('cat1').value;
  const c2=document.getElementById('cat2').value||'';
  const tot=parseInt(document.getElementById('totparc').value)||1;
  const dp=calcDP();
  setLoad(true);
  try{
    const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({nome,tipo,valorTotal:val,pagamento:pag,conta,cat1:c1,cat2:c2,nparc:1,totparc:tot,data:dt,dataParcela:dp})});
    const j=await r.json();
    if(j.ok){setLoad(false);openModal();}
    else{showToast('erro: '+(j.erro||'tente novamente'),true);setLoad(false);}
  }catch(e){showToast('sem conexão',true);setLoad(false);}
}

function openModal(){document.getElementById('mov').classList.add('on');}
function closeModal(){document.getElementById('mov').classList.remove('on');}

function resetar(){
  ['nome','valor','pag','totparc','data'].forEach(id=>document.getElementById(id).value=id==='totparc'?'1':id==='data'?new Date().toISOString().slice(0,10):'');
  document.getElementById('conta').value='Inter';
  document.getElementById('pwrap').style.display='none';
  document.getElementById('prevc').style.display='none';
  document.getElementById('benv').disabled=true;
  setLoad(false);setTipo('Saída');
  document.getElementById('pform').scrollTo({top:0,behavior:'smooth'});
}

async function loadHist(){
  const btn=document.getElementById('bref');
  btn.classList.add('ld');
  document.getElementById('hcont').innerHTML='<div class="hemp">carregando...</div>';
  try{
    const r=await fetch(URL+'?n=20',{method:'GET'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.erro||'erro');
    if(!j.transacoes||!j.transacoes.length){
      document.getElementById('hcont').innerHTML='<div class="hemp">nenhuma transação encontrada</div>';
      return;
    }
    renderHist(j.transacoes);
  }catch(e){
    document.getElementById('hcont').innerHTML=`<div class="herr">erro: ${e.message}<br><br>Confirme que o Apps Script está com acesso "Qualquer pessoa".</div>`;
  }finally{btn.classList.remove('ld');}
}

function fmtDate(s){
  if(!s) return '—';
  // ISO datetime: 2026-01-01T03:00:00.000Z
  if(s.includes('T')){
    const d=new Date(s);
    const dd=String(d.getUTCDate()).padStart(2,'0');
    const mm=String(d.getUTCMonth()+1).padStart(2,'0');
    const yy=d.getUTCFullYear();
    return dd+'/'+mm+'/'+yy;
  }
  // yyyy-MM-dd
  if(s.includes('-')){const[y,m,d]=s.split('-');return d+'/'+m+'/'+y;}
  // já dd/MM/yyyy
  return s;
}

function renderHist(txs){
  // agrupar parcelas crédito
  const grupos=[], visto=new Map();
  txs.forEach(t=>{
    const parcelada=t.pagamento==='Crédito'&&t.parcela&&t.parcela!=='À vista';
    if(!parcelada){grupos.push({single:true,...t});return;}
    const key=t.nome+'|'+t.dataCompra+'|'+t.cat1;
    if(visto.has(key)){
      const g=visto.get(key);
      g.parcelas.push(t);
      g.valorTotal+=parseFloat(t.valor)||0;
    } else {
      const g={single:false,key,...t,valorTotal:parseFloat(t.valor)||0,parcelas:[t]};
      visto.set(key,g);grupos.push(g);
    }
  });

  document.getElementById('hcont').innerHTML=grupos.map((g,i)=>{
    const s=g.tipo==='Saída',cls=s?'s':'e',sig=s?'- ':'+ ';
    const isGrp=!g.single&&g.parcelas&&g.parcelas.length>1;
    const valShow=isGrp?g.valorTotal:(parseFloat(g.valor)||0);
    const dataShow=fmtDate(isGrp?g.dataCompra:g.dataCompra);

    // valor parcela mais frequente
    let vpFmt='';
    if(isGrp){
      const freq={};
      g.parcelas.forEach(p=>{const v=(parseFloat(p.valor)||0).toFixed(2);freq[v]=(freq[v]||0)+1;});
      vpFmt=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
    }

    const cat=g.cat1+(g.cat2?' › '+g.cat2:'');

    // detalhes: para crédito parcelado mostra resumo + parcelas; senão mostra info básica
    let detInner='';
    detInner+=`<div class="detrow"><span class="detk">categoria</span><span class="detv">${cat}</span></div>`;
    detInner+=`<div class="detrow"><span class="detk">conta</span><span class="detv">${g.conta}</span></div>`;
    detInner+=`<div class="detrow"><span class="detk">data compra</span><span class="detv">${fmtDate(g.dataCompra)}</span></div>`;

    if(isGrp){
      detInner+=`<div class="detrow"><span class="detk">pagamento</span><span class="detv">Crédito</span></div>`;
      detInner+=`<div class="detrow"><span class="detk">parcelamento</span><span class="detv">${g.parcelas.length}x de ${fmtR(vpFmt)}</span></div>`;
      detInner+=`<div class="detrow"><span class="detk">valor total</span><span class="detv">${fmtR(valShow)}</span></div>`;
      // subtarefas parcelas
      detInner+=`<div class="parcblock">
        <div class="parcblock-ttl">parcelas</div>
        ${g.parcelas.map(p=>`<div class="parcr">
          <span class="parcn">${p.parcela}</span>
          <span class="parcd">${fmtDate(p.dataParcela)}</span>
          <span class="parcv">${fmtR(p.valor)}</span>
        </div>`).join('')}
      </div>`;
    } else {
      detInner+=`<div class="detrow"><span class="detk">pagamento</span><span class="detv">${g.pagamento}</span></div>`;
      if(g.parcela&&g.parcela!=='À vista'){
        detInner+=`<div class="detrow"><span class="detk">parcela</span><span class="detv">${g.parcela}</span></div>`;
      }
      detInner+=`<div class="detrow"><span class="detk">data parcela</span><span class="detv">${fmtDate(g.dataParcela)}</span></div>`;
    }

    return `<div class="txc" onclick="togTx(${i})">
      <div class="txrow">
        <div class="txleft">
          <div class="txnm">${g.nome||'—'}</div>
          <div class="txdt">${dataShow} · ${isGrp?'Crédito':g.pagamento}</div>
        </div>
        <div class="txright">
          <div class="txvl ${cls}">${sig}${fmtR(valShow)}</div>
          <svg class="txarr" id="arr${i}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="txdet" id="det${i}">${detInner}</div>
    </div>`;
  }).join('');
}

function togTx(i){
  const det=document.getElementById('det'+i);
  const arr=document.getElementById('arr'+i);
  const open=det.classList.toggle('open');
  arr.classList.toggle('open',open);
}

// init
const hoje=new Date();
document.getElementById('dpill').textContent=hoje.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
document.getElementById('data').value=hoje.toISOString().slice(0,10);
setTipo('Saída');
</script>
</body>
</html>
